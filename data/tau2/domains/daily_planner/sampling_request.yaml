  # ════════════════════════════════════════════
  # SCHEMA 9: Delivery failure + recovery
  # Errand has delivery available but it WILL FAIL.
  # Forces: reserve → confirm → try_delivery → fail → recover → pickup.
  # ════════════════════════════════════════════

  - schema_id: delivery_failure
    seed_id_template: 'df_{transport}_{errand_config}_{knowledge}'
    allowed_terminal_profiles:
      - errands_done
    min_depth: 8
    max_depth: 18
    dimensions:

      - dimension_id: transport
        variants:
          - variant_id: available
            start_world:
              - path: agent.transport.status
                set: available
              - path: agent.transport.car_issue
                set: none
              - path: agent.transport.fix_status
                set: not_needed
          - variant_id: flat_tire_rs_ok
            start_world:
              - path: agent.transport.status
                set: unavailable
              - path: agent.transport.car_issue
                set: flat_tire
              - path: agent.transport.fix_status
                set: not_needed
              - path: agent.transport.rideshare_will_succeed
                set: true

      - dimension_id: errand_config
        variants:
          # Errand A: delivery available but WILL FAIL. Errand B: pickup only.
          - variant_id: a_fails_b_pickup
            start_world:
              - path: agent.errand_a.active
                set: true
              - path: agent.errand_a.status
                set: pending
              - path: agent.errand_a.delivery_available
                set: true
              - path: agent.errand_a.item_in_stock
                set: true
              - path: agent.errand_a.delivery_will_succeed
                set: false
              - path: agent.errand_b.active
                set: true
              - path: agent.errand_b.status
                set: pending
              - path: agent.errand_b.delivery_available
                set: false
              - path: agent.errand_b.item_in_stock
                set: true
              - path: agent.finance.available_funds
                set: plenty
          # Both errands: delivery available but BOTH FAIL
          - variant_id: both_fail
            start_world:
              - path: agent.errand_a.active
                set: true
              - path: agent.errand_a.status
                set: pending
              - path: agent.errand_a.delivery_available
                set: true
              - path: agent.errand_a.item_in_stock
                set: true
              - path: agent.errand_a.delivery_will_succeed
                set: false
              - path: agent.errand_b.active
                set: true
              - path: agent.errand_b.status
                set: pending
              - path: agent.errand_b.delivery_available
                set: true
              - path: agent.errand_b.item_in_stock
                set: true
              - path: agent.errand_b.delivery_will_succeed
                set: false
              - path: agent.finance.available_funds
                set: plenty

      - dimension_id: knowledge
        variants:
          - variant_id: cold
            start_bindings: []
          - variant_id: errand_known
            start_bindings: [errand_a_options]

  # ════════════════════════════════════════════
