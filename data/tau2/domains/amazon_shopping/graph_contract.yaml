  # -----------------------------------------------------------------------
  # Action Schemas — Navigate product variants (product 1 only)
  #
  # Each variant click is a soft page navigation — the URL/ASIN changes,
  # price updates, page content refreshes. Agent must screenshot after
  # each click to read the new price. Sequential: a before b.
  #
  # This mirrors real Amazon behavior where clicking storage/color/config
  # options loads a different product variant with different pricing.
  # -----------------------------------------------------------------------

  - schema_id: select_product_variant
    action_id_template: "select_p1_variant_{variant_id}"
    requestor: assistant
    tool_name: computer
    classification: causal
    requires_world:
      - {path: page.type, op: eq, value: product_detail}
      - {path: page.current_product, op: eq, value: "1"}
      - {path: p1.detail_read, op: eq, value: true}
      - {path: task.requires_variants, op: eq, value: true}
    requires_bindings: []
    variants:
      - variant_id: a
        tool_arg_literals:
          actions:
            - {action: left_click, coordinate: variant_option_a}
            - {action: screenshot}
        requires_world:
          - {path: p1.variant_a_viewed, op: eq, value: false}
        effects_world:
          - {path: p1.variant_a_viewed, set: true}
        effects_bindings: []
      - variant_id: b
        tool_arg_literals:
          actions:
            - {action: left_click, coordinate: variant_option_b}
            - {action: screenshot}
        requires_world:
          - {path: p1.variant_a_viewed, op: eq, value: true}
          - {path: p1.variant_b_viewed, op: eq, value: false}
        effects_world:
          - {path: p1.variant_b_viewed, set: true}
        effects_bindings: []
