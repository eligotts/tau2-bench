version: 1
rules:
  - goal_path: agent.incident[active_incident].status
    goal_value: resolved
    check_field: incident_status
    check_op: eq
    expected: resolved
    unmet_reason: Incident is not yet resolved.

  - goal_path: user.actions.smoke_test_state
    goal_value: passed
    check_field: smoke_test_state
    check_op: eq
    expected: passed
    unmet_reason: Smoke test has not passed yet.
