version: 2

context_slots:
  - slot_id: active_account
    entity_type: Account
  - slot_id: active_station
    entity_type: Station
  - slot_id: active_session
    entity_type: ChargeSession

projection_fields:
  - agent.accounts[active_account].hold_status
  - agent.accounts[active_account].payment_token_status
  - agent.accounts[active_account].fraud_lock_state
  - agent.stations[active_station].reachability_state
  - agent.stations[active_station].firmware_state
  - agent.stations[active_station].diagnostics_state
  - agent.network_paths[active_station].backend_link_state
  - agent.network_paths[active_station].cert_state
  - agent.sessions[active_session].profile_state
  - agent.sessions[active_session].retry_state
  - agent.sessions[active_session].charge_state
  - agent.sessions[active_session].last_fault_code
  - agent.sessions[active_session].error_class
  - user.physical.screen_accessible
  - user.physical.station_power_cycle_state
  - user.physical.connector_reseat_state
  - user.physical.cable_inspection_state
  - user.physical.vehicle_ready_state
  - user.physical.app_refresh_state
  - user.physical.test_charge_state

# ---------- TWO BINDINGS (different source tools) ----------
bindings:
  - binding_id: fault_code
    source_tool: check_station_screen
    extraction_path: result.fault_code
    world_path: agent.sessions[active_session].last_fault_code
    observability_all_of:
      - op: eq
        path: user.physical.screen_accessible
        value: true
      - op: eq
        path: agent.stations[active_station].reachability_state
        value: reachable
    observability_any_of: []

  - binding_id: app_error_class
    source_tool: check_app_status
    extraction_path: result.error_class
    world_path: agent.sessions[active_session].error_class
    observability_all_of: []
    observability_any_of: []

actions:
  # ===== KNOWLEDGE ACQUISITION (user, knowledge-only) =====

  - action_id: acquire_fault_code_from_user
    requestor: user
    tool_name: check_station_screen
    classification: knowledge-only
    requires_world:
      - op: eq
        path: user.physical.screen_accessible
        value: true
      - op: eq
        path: agent.stations[active_station].reachability_state
        value: reachable
    requires_absent_world: []
    requires_bindings: []
    requires_absent_bindings:
      - fault_code
    effects_world: []
    effects_bindings:
      - fault_code
    tool_arg_bindings: {}
    stutter_on_fail: true

  - action_id: acquire_error_class_from_user
    requestor: user
    tool_name: check_app_status
    classification: knowledge-only
    requires_world: []
    requires_absent_world: []
    requires_bindings: []
    requires_absent_bindings:
      - app_error_class
    effects_world: []
    effects_bindings:
      - app_error_class
    tool_arg_bindings: {}
    stutter_on_fail: true

  # ===== USER PHYSICAL ACTIONS (with cross-dependencies) =====

  # inspect_cable has no user-action prereqs (first in chain)
  - action_id: user_inspect_cable_path
    requestor: user
    tool_name: inspect_cable_path
    classification: causal
    requires_world: []
    requires_absent_world:
      - op: eq
        path: user.physical.cable_inspection_state
        value: checked_ok
    requires_bindings: []
    requires_absent_bindings: []
    effects_world:
      - path: user.physical.cable_inspection_state
        set: checked_ok
    effects_bindings: []
    tool_arg_bindings: {}
    stutter_on_fail: true

  # reseat_connector requires cable inspection done first
  - action_id: user_reseat_connector
    requestor: user
    tool_name: reseat_connector
    classification: causal
    requires_world:
      - op: eq
        path: agent.stations[active_station].reachability_state
        value: reachable
      - op: eq
        path: user.physical.cable_inspection_state
        value: checked_ok
    requires_absent_world:
      - op: eq
        path: user.physical.connector_reseat_state
        value: reseated
    requires_bindings: []
    requires_absent_bindings: []
    effects_world:
      - path: user.physical.connector_reseat_state
        set: reseated
    effects_bindings: []
    tool_arg_bindings: {}
    stutter_on_fail: true

  # power_cycle requires connector reseated first
  - action_id: user_power_cycle_station
    requestor: user
    tool_name: power_cycle_station
    classification: causal
    requires_world:
      - op: eq
        path: agent.stations[active_station].reachability_state
        value: reachable
      - op: eq
        path: user.physical.connector_reseat_state
        value: reseated
    requires_absent_world:
      - op: eq
        path: user.physical.station_power_cycle_state
        value: done
    requires_bindings: []
    requires_absent_bindings: []
    effects_world:
      - path: user.physical.station_power_cycle_state
        set: done
    effects_bindings: []
    tool_arg_bindings: {}
    stutter_on_fail: true

  # vehicle_ready_mode is independent
  - action_id: user_set_vehicle_ready_mode
    requestor: user
    tool_name: set_vehicle_ready_mode
    classification: causal
    requires_world: []
    requires_absent_world:
      - op: eq
        path: user.physical.vehicle_ready_state
        value: ready
    requires_bindings: []
    requires_absent_bindings: []
    effects_world:
      - path: user.physical.vehicle_ready_state
        set: ready
    effects_bindings: []
    tool_arg_bindings: {}
    stutter_on_fail: true

  # refresh_app is independent
  - action_id: user_refresh_charging_app_session
    requestor: user
    tool_name: refresh_charging_app_session
    classification: causal
    requires_world: []
    requires_absent_world:
      - op: eq
        path: user.physical.app_refresh_state
        value: refreshed
    requires_bindings: []
    requires_absent_bindings: []
    effects_world:
      - path: user.physical.app_refresh_state
        set: refreshed
    effects_bindings: []
    tool_arg_bindings: {}
    stutter_on_fail: true

  # ===== ASSISTANT DIAGNOSTIC (early convergence — requires BOTH bindings) =====

  - action_id: assistant_run_backend_diagnostics
    requestor: assistant
    tool_name: run_backend_diagnostics
    classification: causal
    requires_world:
      - op: eq
        path: agent.stations[active_station].reachability_state
        value: reachable
      - op: eq
        path: agent.stations[active_station].diagnostics_state
        value: idle
    requires_absent_world: []
    requires_bindings:
      - fault_code
      - app_error_class
    requires_absent_bindings: []
    effects_world:
      - path: agent.stations[active_station].diagnostics_state
        set: ran
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
      app_error_class: app_error_class
    stutter_on_fail: true

  # ===== BILLING BRANCH (gated on actual account state) =====

  - action_id: assistant_clear_backend_hold
    requestor: assistant
    tool_name: clear_billing_hold
    classification: causal
    requires_world:
      - op: eq
        path: agent.accounts[active_account].hold_status
        value: present
      - op: eq
        path: agent.stations[active_station].diagnostics_state
        value: ran
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.accounts[active_account].hold_status
        set: cleared
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  - action_id: assistant_refresh_payment_token
    requestor: assistant
    tool_name: refresh_payment_token
    classification: causal
    requires_world:
      - op: eq
        path: agent.accounts[active_account].hold_status
        value: cleared
      - op: eq
        path: agent.accounts[active_account].payment_token_status
        value: invalid
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.accounts[active_account].payment_token_status
        set: valid
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  - action_id: assistant_release_fraud_lock
    requestor: assistant
    tool_name: release_fraud_lock
    classification: causal
    requires_world:
      - op: eq
        path: agent.accounts[active_account].payment_token_status
        value: valid
      - op: eq
        path: agent.accounts[active_account].fraud_lock_state
        value: "on"
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.accounts[active_account].fraud_lock_state
        set: "off"
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  # ===== CONNECTIVITY BRANCH (gated on actual network state) =====

  - action_id: assistant_restore_backend_link
    requestor: assistant
    tool_name: restore_backend_link
    classification: causal
    requires_world:
      - op: eq
        path: agent.network_paths[active_station].backend_link_state
        value: down
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.network_paths[active_station].backend_link_state
        set: up
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  - action_id: assistant_rotate_station_certificate
    requestor: assistant
    tool_name: rotate_station_certificate
    classification: causal
    requires_world:
      - op: eq
        path: agent.network_paths[active_station].backend_link_state
        value: up
      - op: eq
        path: agent.network_paths[active_station].cert_state
        value: stale
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.network_paths[active_station].cert_state
        set: fresh
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  # ===== FIRMWARE (gated on actual firmware state, needs network up) =====

  - action_id: assistant_update_station_firmware
    requestor: assistant
    tool_name: update_station_firmware
    classification: causal
    requires_world:
      - op: eq
        path: agent.stations[active_station].reachability_state
        value: reachable
      - op: eq
        path: agent.network_paths[active_station].backend_link_state
        value: up
      - op: eq
        path: agent.network_paths[active_station].cert_state
        value: fresh
      - op: eq
        path: agent.stations[active_station].firmware_state
        value: outdated
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.stations[active_station].firmware_state
        set: current
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  # ===== VALUE-GATED REPROVISION VARIANTS =====

  - action_id: assistant_reprovision_billing
    requestor: assistant
    tool_name: reprovision_billing
    classification: causal
    requires_world:
      - op: eq
        path: agent.sessions[active_session].error_class
        value: billing
      - op: eq
        path: agent.stations[active_station].diagnostics_state
        value: ran
      - op: eq
        path: agent.accounts[active_account].hold_status
        value: cleared
      - op: eq
        path: agent.accounts[active_account].payment_token_status
        value: valid
      - op: eq
        path: agent.accounts[active_account].fraud_lock_state
        value: "off"
      - op: eq
        path: user.physical.station_power_cycle_state
        value: done
      - op: eq
        path: user.physical.connector_reseat_state
        value: reseated
      - op: eq
        path: user.physical.cable_inspection_state
        value: checked_ok
      - op: eq
        path: user.physical.vehicle_ready_state
        value: ready
      - op: eq
        path: user.physical.app_refresh_state
        value: refreshed
      - op: eq
        path: agent.sessions[active_session].profile_state
        value: not_ready
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.sessions[active_session].profile_state
        set: ready
      - path: agent.sessions[active_session].last_fault_code
        set: NONE
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  - action_id: assistant_reprovision_connectivity
    requestor: assistant
    tool_name: reprovision_connectivity
    classification: causal
    requires_world:
      - op: eq
        path: agent.sessions[active_session].error_class
        value: connectivity
      - op: eq
        path: agent.stations[active_station].diagnostics_state
        value: ran
      - op: eq
        path: agent.network_paths[active_station].backend_link_state
        value: up
      - op: eq
        path: agent.network_paths[active_station].cert_state
        value: fresh
      - op: eq
        path: user.physical.station_power_cycle_state
        value: done
      - op: eq
        path: user.physical.connector_reseat_state
        value: reseated
      - op: eq
        path: user.physical.cable_inspection_state
        value: checked_ok
      - op: eq
        path: user.physical.vehicle_ready_state
        value: ready
      - op: eq
        path: user.physical.app_refresh_state
        value: refreshed
      - op: eq
        path: agent.sessions[active_session].profile_state
        value: not_ready
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.sessions[active_session].profile_state
        set: ready
      - path: agent.sessions[active_session].last_fault_code
        set: NONE
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  - action_id: assistant_reprovision_full_system
    requestor: assistant
    tool_name: reprovision_full_system
    classification: causal
    requires_world:
      - op: eq
        path: agent.sessions[active_session].error_class
        value: full_system
      - op: eq
        path: agent.stations[active_station].diagnostics_state
        value: ran
      - op: eq
        path: agent.accounts[active_account].hold_status
        value: cleared
      - op: eq
        path: agent.accounts[active_account].payment_token_status
        value: valid
      - op: eq
        path: agent.accounts[active_account].fraud_lock_state
        value: "off"
      - op: eq
        path: agent.network_paths[active_station].backend_link_state
        value: up
      - op: eq
        path: agent.network_paths[active_station].cert_state
        value: fresh
      - op: eq
        path: agent.stations[active_station].firmware_state
        value: current
      - op: eq
        path: user.physical.station_power_cycle_state
        value: done
      - op: eq
        path: user.physical.connector_reseat_state
        value: reseated
      - op: eq
        path: user.physical.cable_inspection_state
        value: checked_ok
      - op: eq
        path: user.physical.vehicle_ready_state
        value: ready
      - op: eq
        path: user.physical.app_refresh_state
        value: refreshed
      - op: eq
        path: agent.sessions[active_session].profile_state
        value: not_ready
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.sessions[active_session].profile_state
        set: ready
      - path: agent.sessions[active_session].last_fault_code
        set: NONE
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  # ===== TAIL (post-reprovision) =====

  - action_id: assistant_reset_retry_path
    requestor: assistant
    tool_name: reset_retry_path
    classification: causal
    requires_world:
      - op: eq
        path: agent.sessions[active_session].profile_state
        value: ready
      - op: eq
        path: agent.sessions[active_session].retry_state
        value: not_ready
    requires_absent_world: []
    requires_bindings:
      - fault_code
    requires_absent_bindings: []
    effects_world:
      - path: agent.sessions[active_session].retry_state
        set: ready
    effects_bindings: []
    tool_arg_bindings:
      fault_code: fault_code
    stutter_on_fail: true

  - action_id: user_run_test_charge
    requestor: user
    tool_name: run_test_charge
    classification: causal
    requires_world:
      - op: eq
        path: agent.accounts[active_account].hold_status
        value: cleared
      - op: eq
        path: agent.accounts[active_account].payment_token_status
        value: valid
      - op: eq
        path: agent.accounts[active_account].fraud_lock_state
        value: "off"
      - op: eq
        path: agent.network_paths[active_station].backend_link_state
        value: up
      - op: eq
        path: agent.network_paths[active_station].cert_state
        value: fresh
      - op: eq
        path: agent.stations[active_station].firmware_state
        value: current
      - op: eq
        path: agent.sessions[active_session].profile_state
        value: ready
      - op: eq
        path: agent.sessions[active_session].retry_state
        value: ready
      - op: eq
        path: user.physical.station_power_cycle_state
        value: done
      - op: eq
        path: user.physical.connector_reseat_state
        value: reseated
      - op: eq
        path: user.physical.cable_inspection_state
        value: checked_ok
      - op: eq
        path: user.physical.vehicle_ready_state
        value: ready
      - op: eq
        path: user.physical.app_refresh_state
        value: refreshed
    requires_absent_world:
      - op: eq
        path: agent.sessions[active_session].charge_state
        value: active
    requires_bindings: []
    requires_absent_bindings: []
    effects_world:
      - path: user.physical.test_charge_state
        set: run
      - path: agent.sessions[active_session].charge_state
        set: active
    effects_bindings: []
    tool_arg_bindings: {}
    stutter_on_fail: true

  # ===== STUTTER-ONLY (stop gate checker) =====

  - action_id: user_check_resolution_status
    requestor: user
    tool_name: check_resolution_status
    classification: stutter-only
    requires_world: []
    requires_absent_world: []
    requires_bindings: []
    requires_absent_bindings: []
    effects_world: []
    effects_bindings: []
    tool_arg_bindings: {}
    stutter_on_fail: true

assistant_stutter_allowlist: []
