    domain: ev_charging_support
    reason_for_call: The station is almost fixed but retry still fails and I need
      to get charging active now.
    task_instructions: 'Follow the assistant''s guidance and perform one action at
      a time. Use user tools only when the assistant asks you to. Ground all status
      updates in tool outputs and do not invent tool results. You will consider the
      issue resolved when all required recovery conditions are satisfied in tool-observable
      status checks. When that condition is met, reply with ###STOP###. Before deciding
      the issue is resolved, call check_resolution_status. Only emit ###STOP### when
      check_resolution_status returns resolved=true. If resolved=false, report the
      unmet items and ask the assistant for the next step.'
    persona: You are Sam Rivera, direct and pragmatic, and you execute assistant requests
      one step at a time.
    known_info: You are Sam Rivera using account A3001 at station ST3001 for session
      S3001.
    unknown_info: You do not know backend gate states until the assistant performs
      diagnostics and remediation steps.
    ticket: 'Customer Sam Rivera reports charging failure at ST3001 (session S3001).
      Target outcome: agent.sessions[active_session].charge_state=active; agent.sessions[active_session].retry_state=ready.'
    purpose: null
    relevant_policies: null
    notes: Structural required_actions/required_precedence were sampled from depgraph
      and must remain unchanged.
    initialization_actions:
    - env_type: user
      func_name: set_user_context
      arguments:
        user_id: U3001
        name: Sam Rivera
        account_id: A3001
        station_id: ST3001
        session_id: S3001
    - env_type: assistant
      func_name: set_hold_status
      arguments:
        value: cleared
    - env_type: assistant
      func_name: set_payment_token_status
      arguments:
        value: valid
    - env_type: assistant
      func_name: set_fraud_lock_state
      arguments:
        value: 'off'
    - env_type: assistant
      func_name: set_reachability_state
      arguments:
        value: reachable
    - env_type: assistant
      func_name: set_firmware_state
      arguments:
        value: current
    - env_type: assistant
      func_name: set_diagnostics_state
      arguments:
        value: ran
    - env_type: assistant
      func_name: set_backend_link_state
      arguments:
        value: up
    - env_type: assistant
      func_name: set_cert_state
      arguments:
        value: fresh
    - env_type: assistant
      func_name: set_profile_state
      arguments:
        value: ready
    - env_type: assistant
      func_name: set_retry_state
      arguments:
        value: not_ready
    - env_type: assistant
      func_name: set_charge_state
      arguments:
        value: inactive
    - env_type: assistant
      func_name: set_last_fault_code
      arguments:
        value: RETRY-301
    - env_type: user
      func_name: set_screen_accessible
      arguments:
        value: true
    - env_type: user
      func_name: set_station_power_cycle_state
      arguments:
        value: done
    - env_type: user
      func_name: set_connector_reseat_state
      arguments:
        value: reseated
    - env_type: user
      func_name: set_cable_inspection_state
      arguments:
        value: checked_ok
    - env_type: user
      func_name: set_vehicle_ready_state
      arguments:
        value: ready
    - env_type: user
      func_name: set_app_refresh_state
      arguments:
        value: refreshed
    - env_type: user
      func_name: set_test_charge_state
      arguments:
        value: not_run
    - env_type: user
      func_name: set_stop_gate
      arguments:
        criteria:
        - check_field: charge_status
          op: eq
          expected: active
          unmet_reason: Charging is not active yet.
          observed_from: check_resolution_status.observed.charge_status
        - check_field: retry_state
          op: eq
          expected: ready
          unmet_reason: Retry path is not ready yet.
          observed_from: check_resolution_status.observed.retry_state
    env_assertions:
    - env_type: assistant
      func_name: assert_charge_state
      arguments:
        expected: active
      assert_value: true
      message: null
    - env_type: assistant
      func_name: assert_retry_state
      arguments:
        expected: ready
      assert_value: true
      message: null
    actions:
    - action_id: acquire_fault_code_from_user
      requestor: user
      name: check_station_screen
      arguments: {}
      compare_args: []
    - action_id: assistant_reset_retry_path
      requestor: assistant
      name: reset_retry_path
      arguments:
        fault_code: RETRY-301
      compare_args: []
    - action_id: user_run_test_charge
      requestor: user
      name: run_test_charge
      arguments: {}
      compare_args: []
    reward_basis:
    - ENV_ASSERTION
    - ACTION
