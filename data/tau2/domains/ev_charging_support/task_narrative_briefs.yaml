    user_id: U1001
    name: Jordan Lee
    account_id: A1001
    station_id: ST1001
    session_id: S1001
  start_state_summary:
    world:
    - agent.accounts[active_account].fraud_lock_state = 'on'
    - agent.accounts[active_account].hold_status = 'present'
    - agent.accounts[active_account].payment_token_status = 'invalid'
    - agent.network_paths[active_station].backend_link_state = 'up'
    - agent.network_paths[active_station].cert_state = 'fresh'
