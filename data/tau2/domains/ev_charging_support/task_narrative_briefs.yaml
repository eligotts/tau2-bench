    - agent.sessions[active_session].error_class = 'billing'
    - agent.sessions[active_session].last_fault_code = 'BH-101'
    - agent.sessions[active_session].profile_state = 'not_ready'
    - agent.sessions[active_session].retry_state = 'not_ready'
    - agent.stations[active_station].diagnostics_state = 'idle'
    - agent.stations[active_station].firmware_state = 'current'
    - agent.stations[active_station].reachability_state = 'reachable'
    - user.physical.app_refresh_state = 'stale'
    - user.physical.cable_inspection_state = 'not_checked'
    - user.physical.connector_reseat_state = 'not_reseated'
    - user.physical.screen_accessible = True
    - user.physical.station_power_cycle_state = 'not_done'
    - user.physical.test_charge_state = 'not_run'
    - user.physical.vehicle_ready_state = 'not_ready'
    bindings: []
  goal_state_summary:
    world:
    - agent.accounts[active_account].fraud_lock_state == 'off'
    - agent.accounts[active_account].hold_status == 'cleared'
    - agent.accounts[active_account].payment_token_status == 'valid'
    - agent.sessions[active_session].last_fault_code == 'NONE'
    - agent.sessions[active_session].profile_state == 'ready'
    - agent.stations[active_station].diagnostics_state == 'ran'
    bindings:
    - app_error_class
    - fault_code
  goal_binding_do_not_disclose:
  - billing
  - BH-101
  required_action_chain:
  - acquire_fault_code_from_user
  - acquire_error_class_from_user
  - user_inspect_cable_path
  - user_reseat_connector
  - user_power_cycle_station
  - user_set_vehicle_ready_mode
  - user_refresh_charging_app_session
  - assistant_run_backend_diagnostics
  - assistant_clear_backend_hold
  - assistant_refresh_payment_token
  - assistant_release_fraud_lock
  - assistant_reprovision_billing
  required_precedence:
  - before: acquire_fault_code_from_user
    after: acquire_error_class_from_user
  - before: acquire_error_class_from_user
    after: user_inspect_cable_path
  - before: user_inspect_cable_path
    after: user_reseat_connector
  - before: user_reseat_connector
    after: user_power_cycle_station
  - before: user_power_cycle_station
    after: user_set_vehicle_ready_mode
  - before: user_set_vehicle_ready_mode
    after: user_refresh_charging_app_session
  - before: user_refresh_charging_app_session
    after: assistant_run_backend_diagnostics
  - before: assistant_run_backend_diagnostics
    after: assistant_clear_backend_hold
  - before: assistant_clear_backend_hold
    after: assistant_refresh_payment_token
  - before: assistant_refresh_payment_token
    after: assistant_release_fraud_lock
  - before: assistant_release_fraud_lock
    after: assistant_reprovision_billing
  completion_cues:
  - goal: agent.accounts[active_account].fraud_lock_state == 'off'
    check_field: fraud_lock_state
    expected: 'off'
    unmet_reason: Fraud lock is still active.
    observed_from: check_resolution_status.observed.fraud_lock_state
  - goal: agent.accounts[active_account].hold_status == 'cleared'
    check_field: hold_status
    expected: cleared
    unmet_reason: Backend hold is not cleared yet.
    observed_from: check_resolution_status.observed.hold_status
  - goal: agent.accounts[active_account].payment_token_status == 'valid'
    check_field: payment_token_status
    expected: valid
    unmet_reason: Payment token is not valid yet.
    observed_from: check_resolution_status.observed.payment_token_status
  - goal: agent.sessions[active_session].last_fault_code == 'NONE'
    check_field: fault_code
    expected: NONE
    unmet_reason: Station still reports an unresolved fault code.
    observed_from: check_resolution_status.observed.fault_code
  - goal: agent.sessions[active_session].profile_state == 'ready'
    check_field: profile_state
    expected: ready
    unmet_reason: Charging profile is not ready yet.
    observed_from: check_resolution_status.observed.profile_state
  - goal: agent.stations[active_station].diagnostics_state == 'ran'
    check_field: diagnostics_state
    expected: ran
    unmet_reason: Backend diagnostics have not run yet.
    observed_from: check_resolution_status.observed.diagnostics_state
  authoring_guidance:
    entity_ids_are_plumbing: "Entity slot IDs in entity_context (account_id, station_id,\
      \ session_id) are invisible plumbing \u2014 set by initialization_actions, resolved\
      \ from context by tools. They must NEVER appear in authored text. Only the customer\
      \ name is user-facing. Bindings (error codes, plan names) in start_state_summary.bindings\
      \ ARE user-observable and should be included."
    reason_for_call: First person, conversational. Describe what the user is experiencing
      and what they want fixed. Include frustration or urgency cues. Never mention
      internal paths, tool names, or solution steps.
    known_info: "Second person. Start with 'You are [name]' using ONLY the name from\
      \ entity_context. Add situational context the user would naturally know (location,\
      \ what they observe, what they were doing). Include concrete start-binding values\
      \ (e.g. error codes) when present \u2014 these are user-observable facts, not\
      \ plumbing."
    ticket: "Third person, agent-facing case summary. Start with the problem, then\
      \ customer name. End with 'They will consider the issue resolved when...' describing\
      \ a concrete observable outcome. Read completion_cues to understand what resolved\
      \ means, but write it as natural language \u2014 the ticket gives the agent\
      \ direction, not a mechanical checklist. Be specific enough that the agent knows\
      \ what kind of task this is."
