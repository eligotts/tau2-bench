version: 1
rules:
  - goal_path: agent.accounts[active_account].hold_status
    goal_value: cleared
    check_field: hold_status
    check_op: eq
    expected: cleared
    unmet_reason: Backend hold is not cleared yet.
    observed_from: check_resolution_status.observed.hold_status

  - goal_path: agent.accounts[active_account].payment_token_status
    goal_value: valid
    check_field: payment_token_status
    check_op: eq
    expected: valid
    unmet_reason: Payment token is not valid yet.
    observed_from: check_resolution_status.observed.payment_token_status

  - goal_path: agent.accounts[active_account].fraud_lock_state
    goal_value: "off"
    check_field: fraud_lock_state
    check_op: eq
    expected: "off"
    unmet_reason: Fraud lock is still active.
    observed_from: check_resolution_status.observed.fraud_lock_state

  - goal_path: agent.stations[active_station].diagnostics_state
    goal_value: ran
    check_field: diagnostics_state
    check_op: eq
    expected: ran
    unmet_reason: Backend diagnostics have not run yet.
    observed_from: check_resolution_status.observed.diagnostics_state

  - goal_path: agent.stations[active_station].firmware_state
    goal_value: current
    check_field: firmware_state
    check_op: eq
    expected: current
    unmet_reason: Station firmware is not current yet.
    observed_from: check_resolution_status.observed.firmware_state

  - goal_path: agent.network_paths[active_station].backend_link_state
    goal_value: up
    check_field: backend_link_state
    check_op: eq
    expected: up
    unmet_reason: Backend link is still down.
    observed_from: check_resolution_status.observed.backend_link_state

  - goal_path: agent.network_paths[active_station].cert_state
    goal_value: fresh
    check_field: cert_state
    check_op: eq
    expected: fresh
    unmet_reason: Station certificate is still stale.
    observed_from: check_resolution_status.observed.cert_state

  - goal_path: agent.sessions[active_session].profile_state
    goal_value: ready
    check_field: profile_state
    check_op: eq
    expected: ready
    unmet_reason: Charging profile is not ready yet.
    observed_from: check_resolution_status.observed.profile_state

  - goal_path: agent.sessions[active_session].retry_state
    goal_value: ready
    check_field: retry_state
    check_op: eq
    expected: ready
    unmet_reason: Retry path is not ready yet.
    observed_from: check_resolution_status.observed.retry_state

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: STATION_UNREACHABLE
    check_field: fault_code
    check_op: eq
    expected: STATION_UNREACHABLE
    unmet_reason: Station still shows a station-unreachable fault.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: NET-410
    check_field: fault_code
    check_op: eq
    expected: NET-410
    unmet_reason: Station still shows a backend-link fault.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: CERT-409
    check_field: fault_code
    check_op: eq
    expected: CERT-409
    unmet_reason: Station still shows a certificate fault.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: BH-101
    check_field: fault_code
    check_op: eq
    expected: BH-101
    unmet_reason: Station still shows the billing-hold fault code.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: PAY-201
    check_field: fault_code
    check_op: eq
    expected: PAY-201
    unmet_reason: Station still shows the payment-token fault code.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: FRD-301
    check_field: fault_code
    check_op: eq
    expected: FRD-301
    unmet_reason: Station still shows the fraud-lock fault code.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: FW-410
    check_field: fault_code
    check_op: eq
    expected: FW-410
    unmet_reason: Station still shows the firmware fault code.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: PROFILE-201
    check_field: fault_code
    check_op: eq
    expected: PROFILE-201
    unmet_reason: Station still shows the profile fault code.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: RETRY-301
    check_field: fault_code
    check_op: eq
    expected: RETRY-301
    unmet_reason: Station still shows the retry-path fault code.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: NONE
    check_field: fault_code
    check_op: eq
    expected: NONE
    unmet_reason: Station still reports an unresolved fault code.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].charge_state
    goal_value: active
    check_field: charge_status
    check_op: eq
    expected: active
    unmet_reason: Charging is not active yet.
    observed_from: check_resolution_status.observed.charge_status
