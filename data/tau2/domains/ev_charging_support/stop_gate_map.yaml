version: 1
rules:
  - goal_path: agent.accounts[active_account].hold_status
    goal_value: cleared
    check_field: hold_status
    check_op: eq
    expected: cleared
    unmet_reason: Backend hold is not cleared yet.
    observed_from: check_resolution_status.observed.hold_status

  - goal_path: agent.sessions[active_session].profile_state
    goal_value: ready
    check_field: profile_state
    check_op: eq
    expected: ready
    unmet_reason: Charging profile is not ready yet.
    observed_from: check_resolution_status.observed.profile_state

  - goal_path: agent.sessions[active_session].retry_state
    goal_value: ready
    check_field: retry_state
    check_op: eq
    expected: ready
    unmet_reason: Retry path is not ready yet.
    observed_from: check_resolution_status.observed.retry_state

  - goal_path: agent.sessions[active_session].last_fault_code
    goal_value: NONE
    check_field: fault_code
    check_op: eq
    expected: NONE
    unmet_reason: Station still reports a fault code.
    observed_from: check_resolution_status.observed.fault_code

  - goal_path: agent.sessions[active_session].charge_state
    goal_value: active
    check_field: charge_status
    check_op: eq
    expected: active
    unmet_reason: Charging is not active yet.
    observed_from: check_resolution_status.observed.charge_status
