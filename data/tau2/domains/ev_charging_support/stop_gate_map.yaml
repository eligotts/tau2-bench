version: 1
rules:
  - goal_path: agent.sessions[active_session].charge_state
    goal_value: active
    check_field: charge_status
    check_op: eq
    expected: active
    unmet_reason: Charging is not active yet.

  - goal_path: user.physical.test_charge_state
    goal_value: run
    check_field: test_charge_state
    check_op: eq
    expected: run
    unmet_reason: Test charge has not been run yet.
