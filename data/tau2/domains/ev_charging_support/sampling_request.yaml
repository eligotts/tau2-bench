version: 1
max_tasks: 120
terminal_profiles:
- profile_id: billing_resolved
  description: Billing branch resolved — charging active, user verified.
  requires_world:
  - path: agent.sessions[active_session].error_class
    op: eq
    value: billing
  - path: agent.sessions[active_session].charge_state
    op: eq
    value: active
  - path: user.physical.test_charge_state
    op: eq
    value: run
- profile_id: connectivity_resolved
  description: Connectivity branch resolved — charging active, user verified.
  requires_world:
  - path: agent.sessions[active_session].error_class
    op: eq
    value: connectivity
  - path: agent.sessions[active_session].charge_state
    op: eq
    value: active
  - path: user.physical.test_charge_state
    op: eq
    value: run
- profile_id: full_system_resolved
