version: 1
max_tasks: 70
goal_world_path_prefixes:
  - agent.
terminal_profiles:
  - profile_id: billing_resolved
    description: Billing branch fully resolved and charging can start.
    requires_world:
      - path: agent.accounts[active_account].hold_status
        op: eq
        value: cleared
      - path: agent.accounts[active_account].payment_token_status
        op: eq
        value: valid
      - path: agent.accounts[active_account].fraud_lock_state
        op: eq
        value: 'off'
      - path: agent.stations[active_station].diagnostics_state
        op: eq
        value: ran
      - path: agent.sessions[active_session].profile_state
        op: eq
        value: ready
      - path: agent.sessions[active_session].retry_state
        op: eq
        value: ready
      - path: agent.sessions[active_session].charge_state
        op: eq
        value: active
      - path: agent.sessions[active_session].last_fault_code
        op: eq
        value: NONE
  - profile_id: connectivity_resolved
    description: Connectivity branch fully resolved and charging can start.
    requires_world:
      - path: agent.stations[active_station].diagnostics_state
        op: eq
        value: ran
      - path: agent.network_paths[active_station].backend_link_state
        op: eq
        value: up
      - path: agent.network_paths[active_station].cert_state
        op: eq
        value: fresh
      - path: agent.sessions[active_session].profile_state
        op: eq
        value: ready
      - path: agent.sessions[active_session].retry_state
        op: eq
        value: ready
      - path: agent.sessions[active_session].charge_state
        op: eq
        value: active
      - path: agent.sessions[active_session].last_fault_code
        op: eq
        value: NONE
  - profile_id: full_system_resolved
    description: Full-system branch fully resolved and charging can start.
    requires_world:
      - path: agent.accounts[active_account].hold_status
        op: eq
        value: cleared
      - path: agent.accounts[active_account].payment_token_status
