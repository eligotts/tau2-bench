version: 1
max_tasks: 30
goal_world_path_prefixes:
  - agent.
seeds:
  # === BILLING BRANCH: account broken, network/firmware fine ===
  - seed_id: ev_billing_recovery
    start_world:
      - path: agent.accounts[active_account].hold_status
        set: present
      - path: agent.accounts[active_account].payment_token_status
        set: invalid
      - path: agent.accounts[active_account].fraud_lock_state
        set: "on"
      - path: agent.stations[active_station].reachability_state
        set: reachable
      - path: agent.stations[active_station].firmware_state
        set: current
      - path: agent.stations[active_station].diagnostics_state
        set: idle
      - path: agent.network_paths[active_station].backend_link_state
        set: up
      - path: agent.network_paths[active_station].cert_state
        set: fresh
      - path: agent.sessions[active_session].profile_state
        set: not_ready
      - path: agent.sessions[active_session].retry_state
        set: not_ready
      - path: agent.sessions[active_session].charge_state
        set: inactive
      - path: agent.sessions[active_session].last_fault_code
        set: BH-101
      - path: agent.sessions[active_session].error_class
        set: billing
      - path: user.physical.screen_accessible
        set: true
      - path: user.physical.station_power_cycle_state
        set: not_done
      - path: user.physical.connector_reseat_state
        set: not_reseated
      - path: user.physical.cable_inspection_state
        set: not_checked
      - path: user.physical.vehicle_ready_state
        set: not_ready
      - path: user.physical.app_refresh_state
        set: stale
      - path: user.physical.test_charge_state
        set: not_run
    start_bindings: []
    min_depth: 8
    max_depth: 16

  # === CONNECTIVITY BRANCH: network broken, account/firmware fine ===
  - seed_id: ev_connectivity_recovery
    start_world:
      - path: agent.accounts[active_account].hold_status
        set: cleared
      - path: agent.accounts[active_account].payment_token_status
        set: valid
      - path: agent.accounts[active_account].fraud_lock_state
        set: "off"
      - path: agent.stations[active_station].reachability_state
        set: reachable
      - path: agent.stations[active_station].firmware_state
        set: current
      - path: agent.stations[active_station].diagnostics_state
        set: idle
      - path: agent.network_paths[active_station].backend_link_state
        set: down
      - path: agent.network_paths[active_station].cert_state
        set: stale
      - path: agent.sessions[active_session].profile_state
        set: not_ready
      - path: agent.sessions[active_session].retry_state
        set: not_ready
      - path: agent.sessions[active_session].charge_state
        set: inactive
      - path: agent.sessions[active_session].last_fault_code
        set: CERT-409
      - path: agent.sessions[active_session].error_class
        set: connectivity
      - path: user.physical.screen_accessible
        set: true
      - path: user.physical.station_power_cycle_state
        set: not_done
      - path: user.physical.connector_reseat_state
        set: not_reseated
      - path: user.physical.cable_inspection_state
        set: not_checked
      - path: user.physical.vehicle_ready_state
        set: not_ready
      - path: user.physical.app_refresh_state
        set: stale
      - path: user.physical.test_charge_state
        set: not_run
    start_bindings: []
    min_depth: 7
    max_depth: 14

  # === FULL SYSTEM BRANCH: account + network + firmware all broken ===
  - seed_id: ev_full_system_recovery
    start_world:
      - path: agent.accounts[active_account].hold_status
        set: present
      - path: agent.accounts[active_account].payment_token_status
        set: invalid
      - path: agent.accounts[active_account].fraud_lock_state
        set: "on"
      - path: agent.stations[active_station].reachability_state
        set: reachable
      - path: agent.stations[active_station].firmware_state
        set: outdated
      - path: agent.stations[active_station].diagnostics_state
        set: idle
      - path: agent.network_paths[active_station].backend_link_state
        set: down
      - path: agent.network_paths[active_station].cert_state
        set: stale
      - path: agent.sessions[active_session].profile_state
        set: not_ready
      - path: agent.sessions[active_session].retry_state
        set: not_ready
      - path: agent.sessions[active_session].charge_state
        set: inactive
      - path: agent.sessions[active_session].last_fault_code
        set: FW-410
      - path: agent.sessions[active_session].error_class
        set: full_system
      - path: user.physical.screen_accessible
        set: true
      - path: user.physical.station_power_cycle_state
        set: not_done
      - path: user.physical.connector_reseat_state
        set: not_reseated
      - path: user.physical.cable_inspection_state
        set: not_checked
      - path: user.physical.vehicle_ready_state
        set: not_ready
      - path: user.physical.app_refresh_state
        set: stale
      - path: user.physical.test_charge_state
        set: not_run
    start_bindings: []
    min_depth: 10
    max_depth: 18

  # === BILLING WITH PARTIAL KNOWLEDGE: fault code pre-known ===
  - seed_id: ev_billing_partial_knowledge
    start_world:
      - path: agent.accounts[active_account].hold_status
        set: present
      - path: agent.accounts[active_account].payment_token_status
        set: invalid
      - path: agent.accounts[active_account].fraud_lock_state
        set: "on"
      - path: agent.stations[active_station].reachability_state
        set: reachable
      - path: agent.stations[active_station].firmware_state
        set: current
      - path: agent.stations[active_station].diagnostics_state
        set: idle
      - path: agent.network_paths[active_station].backend_link_state
        set: up
      - path: agent.network_paths[active_station].cert_state
        set: fresh
      - path: agent.sessions[active_session].profile_state
        set: not_ready
      - path: agent.sessions[active_session].retry_state
        set: not_ready
      - path: agent.sessions[active_session].charge_state
        set: inactive
      - path: agent.sessions[active_session].last_fault_code
        set: BH-101
      - path: agent.sessions[active_session].error_class
        set: billing
      - path: user.physical.screen_accessible
        set: true
      - path: user.physical.station_power_cycle_state
        set: not_done
      - path: user.physical.connector_reseat_state
        set: not_reseated
      - path: user.physical.cable_inspection_state
        set: not_checked
      - path: user.physical.vehicle_ready_state
        set: not_ready
      - path: user.physical.app_refresh_state
        set: stale
      - path: user.physical.test_charge_state
        set: not_run
    start_bindings:
      - fault_code
    min_depth: 7
    max_depth: 14

  # === CONNECTIVITY WITH PHYSICAL PARTIALLY DONE ===
  - seed_id: ev_connectivity_partial_physical
    start_world:
      - path: agent.accounts[active_account].hold_status
        set: cleared
      - path: agent.accounts[active_account].payment_token_status
        set: valid
      - path: agent.accounts[active_account].fraud_lock_state
        set: "off"
      - path: agent.stations[active_station].reachability_state
        set: reachable
      - path: agent.stations[active_station].firmware_state
        set: current
      - path: agent.stations[active_station].diagnostics_state
        set: idle
      - path: agent.network_paths[active_station].backend_link_state
        set: down
      - path: agent.network_paths[active_station].cert_state
        set: stale
      - path: agent.sessions[active_session].profile_state
        set: not_ready
      - path: agent.sessions[active_session].retry_state
        set: not_ready
      - path: agent.sessions[active_session].charge_state
        set: inactive
      - path: agent.sessions[active_session].last_fault_code
        set: CERT-409
      - path: agent.sessions[active_session].error_class
        set: connectivity
      - path: user.physical.screen_accessible
        set: true
      - path: user.physical.station_power_cycle_state
        set: not_done
      - path: user.physical.connector_reseat_state
        set: not_reseated
      - path: user.physical.cable_inspection_state
        set: checked_ok
      - path: user.physical.vehicle_ready_state
        set: ready
      - path: user.physical.app_refresh_state
        set: refreshed
      - path: user.physical.test_charge_state
        set: not_run
    start_bindings: []
    min_depth: 5
    max_depth: 12
