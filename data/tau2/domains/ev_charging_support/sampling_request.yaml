version: 1
max_tasks: 8
goal_world_path_prefixes:
  - agent.
goal_binding_prefixes: []
seeds:
  - seed_id: ev_recovery_full
    start_world:
      - path: agent.accounts[active_account].hold_status
        set: present
      - path: agent.stations[active_station].reachability_state
        set: reachable
      - path: agent.sessions[active_session].profile_state
        set: not_ready
      - path: agent.sessions[active_session].retry_state
        set: not_ready
      - path: agent.sessions[active_session].charge_state
        set: inactive
      - path: agent.sessions[active_session].last_fault_code
        set: BH-101
      - path: user.physical.screen_accessible
        set: true
      - path: user.physical.station_power_cycle_state
        set: not_done
      - path: user.physical.connector_reseat_state
        set: not_reseated
      - path: user.physical.test_charge_state
        set: not_run
    start_bindings: []
    min_depth: 4
    max_depth: 7
  - seed_id: ev_recovery_post_hold
    start_world:
      - path: agent.accounts[active_account].hold_status
        set: cleared
      - path: agent.stations[active_station].reachability_state
        set: reachable
      - path: agent.sessions[active_session].profile_state
        set: not_ready
      - path: agent.sessions[active_session].retry_state
        set: not_ready
      - path: agent.sessions[active_session].charge_state
        set: inactive
      - path: agent.sessions[active_session].last_fault_code
        set: BH-101
      - path: user.physical.screen_accessible
        set: true
      - path: user.physical.station_power_cycle_state
        set: not_done
      - path: user.physical.connector_reseat_state
        set: not_reseated
      - path: user.physical.test_charge_state
        set: not_run
    start_bindings: []
    min_depth: 4
    max_depth: 7
