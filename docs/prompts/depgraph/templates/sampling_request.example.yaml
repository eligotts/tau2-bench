version: 1
max_tasks: 5
goal_world_path_prefixes:
  - agent.
goal_binding_prefixes: []
seeds:
  - seed_id: telecom_seed_01
    start_world:
      - path: agent.lines[active_line].profile_state
        set: pending
      - path: user.physical.phone_powered_on
        set: true
      - path: user.physical.phone_restarted
        set: false
    start_bindings: []
    min_depth: 4
    max_depth: 7
