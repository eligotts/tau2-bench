version: 1
max_tasks: 5
goal_capture_paths:
  - agent.lines[active_line]
  - user.physical
terminal_profiles:
  - profile_id: fully_resolved
    requires_world:
      - path: agent.lines[active_line].data_status
        op: eq
        value: active
seeds:
  - seed_id: telecom_seed_01
    allowed_terminal_profiles: [fully_resolved]
    start_world:
      - path: agent.lines[active_line].profile_state
        set: pending
      - path: user.physical.phone_powered_on
        set: true
      - path: user.physical.phone_restarted
        set: false
    start_bindings: []
    min_depth: 4
    max_depth: 7
