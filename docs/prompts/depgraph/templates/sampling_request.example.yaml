version: 1
max_tasks: 5
terminal_profiles:
  - profile_id: fully_resolved
    requires_world:
      - path: agent.lines[active_line].data_status
        op: eq
        value: active

# Option A: flat terminal_profiles (above) — one profile per goal state.
# Option B: terminal_schemas with cartesian expansion — generates one
# terminal_profile per combination of dimension variants.
