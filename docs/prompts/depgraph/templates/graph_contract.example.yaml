version: 2

context_slots:
  - slot_id: active_customer
    entity_type: Customer
  - slot_id: active_line
    entity_type: Line

projection_fields:
  - agent.customers[active_customer].exists
  - agent.lines[active_line].profile_state
  - agent.lines[active_line].data_status
  - agent.lines[active_line].iccid_observed
  - user.physical.phone_powered_on
  - user.physical.phone_restarted

bindings:
  - binding_id: iccid
    source_tool: get_sim_info
    extraction_path: result.iccid
    # world_path allows the runtime to invalidate the binding if the canonical observed
    # value changes. If this path is volatile, only immediate observation-driven tools
    # should consume the binding through tool_arg_bindings.
    world_path: agent.lines[active_line].iccid_observed
    observability_all_of:
      - op: eq
        path: user.physical.phone_powered_on
        value: true
      - op: eq
        path: agent.customers[active_customer].exists
        value: true
    observability_any_of: []

actions:
  - action_id: power_on_phone
    requestor: user
    tool_name: power_on_phone
    classification: causal
    requires_world:
      - op: neq
        path: user.physical.phone_powered_on
        value: true
    requires_bindings: []
    effects_world:
      - path: user.physical.phone_powered_on
        set: true
    effects_bindings: []
    tool_arg_bindings: {}

  - action_id: acquire_iccid
    requestor: user
    tool_name: get_sim_info
    classification: knowledge-only
    requires_world:
      - op: eq
        path: user.physical.phone_powered_on
        value: true
    requires_bindings:
      - binding_id: iccid
        acquired: false
    effects_world: []
    effects_bindings: [iccid]
    tool_arg_bindings: {}

  - action_id: restart_phone
    requestor: user
    tool_name: restart_phone
    classification: causal
    requires_world:
      - op: eq
        path: user.physical.phone_powered_on
        value: true
      - op: neq
        path: user.physical.phone_restarted
        value: true
    requires_bindings: []
    effects_world:
      - path: user.physical.phone_restarted
        set: true
    effects_bindings: []
    tool_arg_bindings: {}

  - action_id: reprovision_esim
    requestor: assistant
    tool_name: reprovision_esim
    classification: causal
    requires_world:
      - op: eq
        path: user.physical.phone_restarted
        value: true
      - op: eq
        path: agent.lines[active_line].profile_state
        value: pending
    requires_bindings:
      - binding_id: iccid
        acquired: true
    effects_world:
      - path: agent.lines[active_line].profile_state
        set: ready
    effects_bindings: []
    tool_arg_bindings:
      iccid: iccid

# Optional authoring sugar when one conceptual tool has multiple finite modes.
# The loader expands these into ordinary `actions` before search/preflight.
#
# action_schemas:
#   - schema_id: assistant_reprovision
#     action_id_template: reprovision_{mode}
#     variant_param: mode
#     requestor: assistant
#     tool_name: reprovision
#     classification: causal
#     requires_bindings:
#       - binding_id: iccid
#         acquired: true
#     tool_arg_bindings:
#       iccid: iccid
#     variants:
#       - variant_id: esim
#         tool_arg_literals:
#           mode: esim
#       - variant_id: physical_sim
#         tool_arg_literals:
#           mode: physical_sim

  - action_id: run_data_test
    requestor: user
    tool_name: run_data_test
    classification: causal
    requires_world:
      - op: eq
        path: agent.lines[active_line].profile_state
        value: ready
    requires_bindings: []
    effects_world:
      - path: agent.lines[active_line].data_status
        set: active
    effects_bindings: []
    tool_arg_bindings: {}

  - action_id: check_resolution_status_gate
    requestor: user
    tool_name: check_resolution_status
    classification: stutter-only
    requires_world: []
    requires_bindings: []
    effects_world: []
    effects_bindings: []
    tool_arg_bindings: {}

sync_rules: []
